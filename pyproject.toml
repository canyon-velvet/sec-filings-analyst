[project]
name = "sec-filings-analyst"
version = "0.1.0"
description = "Agentic RAG chat over any company's SEC filings, evaluated on FinanceBench"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=3.35.1",
    "psycopg[binary]>=3.2",
    "pypdfium2>=5",
    "tiktoken>=0.8",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]  # for `from fakes...`
markers = ["integration: needs local services (Postgres) or data (make data); excluded from CI"]
